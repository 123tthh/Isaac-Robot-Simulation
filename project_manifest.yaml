schema_version: 1
project:
  name: isaac-robot-simulation
  normalized_root: .
  root_resolution: directory_containing_project_manifest
runtime:
  isaac_sim: 5.1.0
  ros_supported_default: jazzy
  ros_requested_docs: jazzy
  isaac_lab_arena_source: optional
  canonical_robot_source: projects/ros2_ws/src/robot
container:
  workspace: /workspace
  ros2_ws: /workspace/projects/ros2_ws
  trajectory_dir: /workspace/projects/teleoperation
  sim1_dir: /workspace/projects/teleoperation/sim1
  ros2_log_dir: /workspace/data/ros2_log
  isaac_usd_path: /workspace/assets/scenes/scene_portable.usda
  output_dir: /workspace/outputs
entrypoints:
  command: ./run.sh
  introduction: docs/overview.md
  introduction_zh: docs/overview.zh-CN.md
  guide: docs/getting-started.md
  guide_zh: docs/getting-started.zh-CN.md
  physics_parameters: projects/physics_parameters
lerobot:
  v21_user_data: local_optional
  v21_generation: optional
  v21_generation_env: SIM1_GENERATE_LEROBOT_V21
  dataset_path_env: LEROBOT_DATASET_PATH
  npz_path_env: LEROBOT_NPZ_PATH
documentation:
  isaac_sim: https://docs.isaacsim.omniverse.nvidia.com/5.1.0
  ros2: https://docs.ros.org/en/jazzy
